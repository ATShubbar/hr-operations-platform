name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://hr:hr_local_dev@localhost:5432/hr_platform
  STAFF_DATABASE_URL: postgresql://app_staff:app_staff_dev_pw@localhost:5432/hr_platform
  CLIENT_DATABASE_URL: postgresql://app_client:app_client_dev_pw@localhost:5432/hr_platform
  EMPLOYEE_DATABASE_URL: postgresql://app_employee:app_employee_dev_pw@localhost:5432/hr_platform
  REDIS_URL: redis://localhost:6379
  APP_WEB_ORIGIN: http://localhost:3000
  # Throwaway MinIO credentials — the same dev values docker-compose.yml publishes.
  STORAGE_ENDPOINT: http://localhost:9000
  STORAGE_REGION: us-east-1
  STORAGE_BUCKET: hr-documents
  STORAGE_ACCESS_KEY: hr_minio
  STORAGE_SECRET_KEY: hr_minio_dev_pw

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hr
          POSTGRES_PASSWORD: hr_local_dev
          POSTGRES_DB: hr_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hr -d hr_platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm pinned via packageManager)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations (includes RLS roles + policies)
        run: pnpm --filter @hr/api db:deploy

      # The seed loads API modules, which import @hr/contracts/@hr/dates — those
      # resolve to dist/, which nothing has built yet at this point.
      - name: Build the API's workspace packages
        run: pnpm turbo run build --filter='@hr/api^...'

      # Document e2e specs upload to object storage — and (SEED-01) the seed writes
      # the file behind every seeded document, so MinIO starts BEFORE the seed. MinIO stopped publishing
      # images (Docker Hub and Quay both refuse `minio/minio` since late 2025), so
      # this is Bitnami's frozen MinIO build, pinned by digest. Its entrypoint
      # starts the server itself (no `server /data` argument).
      - name: Start MinIO (object storage for the document specs)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$STORAGE_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$STORAGE_SECRET_KEY" \
            bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          docker logs minio; exit 1

      # Several e2e specs read the seed's fixed fixtures (client A, its
      # employees). Locally the database is always seeded; CI never was, so those
      # specs had failed on every push since they were written — unseen, because
      # nothing deployed from CI until GCP-04. Seeding here makes CI run the suite
      # under the same conditions as every local run.
      - name: Seed the test database
        run: pnpm --filter @hr/api db:seed

      - name: Lint, typecheck, test, build
        run: pnpm turbo run lint typecheck test build

  # UAT deploy (GCP-04): Cloud Run in me-central1 (ADR-006 rev. 7), keyless.
  # GitHub proves who it is to Google through Workload Identity Federation (the
  # provider accepts ONLY this repository on main); no key is stored anywhere.
  # Order: images -> migrate job (incl. role passwords) -> API -> worker pool ->
  # web -> health through the public web address.
  deploy-uat:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-uat
      cancel-in-progress: false
    env:
      REGION: me-central1
      REPO: me-central1-docker.pkg.dev/peoplegro-prod/peoplegro
      TAG: ${{ github.sha }}
      SQL: peoplegro-prod:me-central1:uat-pg
      API_URL: https://uat-api-1048926106506.me-central1.run.app
      WEB_URL: https://uat-web-1048926106506.me-central1.run.app
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1048926106506/locations/global/workloadIdentityPools/github/providers/hr-operations-platform
          service_account: uat-deployer@peoplegro-prod.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push images
        run: |
          gcloud auth configure-docker me-central1-docker.pkg.dev --quiet
          docker build -f apps/api/Dockerfile --target runtime -t "$REPO/api:$TAG" .
          docker build -f apps/api/Dockerfile --target migrate -t "$REPO/migrate:$TAG" .
          docker build -f apps/web/Dockerfile --build-arg API_PROXY_TARGET="$API_URL" -t "$REPO/web-uat:$TAG" .
          docker push "$REPO/api:$TAG"
          docker push "$REPO/migrate:$TAG"
          docker push "$REPO/web-uat:$TAG"

      - name: Migrate (and set the app role passwords)
        run: |
          gcloud run jobs deploy uat-migrate --image "$REPO/migrate:$TAG" --region "$REGION" \
            --service-account uat-migrate@peoplegro-prod.iam.gserviceaccount.com \
            --set-cloudsql-instances "$SQL" \
            --set-secrets DATABASE_URL=uat-database-url:latest,APP_STAFF_DB_PASSWORD=uat-db-app-staff-password:latest,APP_CLIENT_DB_PASSWORD=uat-db-app-client-password:latest,APP_EMPLOYEE_DB_PASSWORD=uat-db-app-employee-password:latest \
            --max-retries 0 --task-timeout 600 --labels env=uat --quiet
          gcloud run jobs execute uat-migrate --region "$REGION" --wait

      - name: Deploy API (internal only)
        run: |
          { cat infra/gcp/uat-env.yaml; echo "BUILD_VERSION: $TAG"; } > /tmp/uat-api-env.yaml
          gcloud run deploy uat-api --image "$REPO/api:$TAG" --region "$REGION" \
            --service-account uat-run@peoplegro-prod.iam.gserviceaccount.com \
            --ingress internal --set-cloudsql-instances "$SQL" \
            --network default --subnet default --vpc-egress private-ranges-only \
            --env-vars-file /tmp/uat-api-env.yaml \
            --set-secrets "$(paste -sd, infra/gcp/uat-runtime-secrets.txt)" \
            --cpu 1 --memory 1Gi --min-instances 0 --max-instances 2 --labels env=uat --quiet

      - name: Deploy worker pool (always on)
        run: python3 infra/gcp/deploy-worker-pool.py "$REPO/api:$TAG" "$TAG"

      - name: Deploy web (public)
        run: |
          gcloud run deploy uat-web --image "$REPO/web-uat:$TAG" --region "$REGION" \
            --service-account uat-web@peoplegro-prod.iam.gserviceaccount.com \
            --ingress all --network default --subnet default --vpc-egress all-traffic \
            --set-env-vars NODE_ENV=production \
            --cpu 1 --memory 512Mi --min-instances 0 --max-instances 2 --labels env=uat --quiet

      - name: Health through the public web address
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS "$WEB_URL/api/health" && curl -fsS "$WEB_URL/api/ready" && exit 0
            sleep 10
          done
          echo "UAT health check failed" >&2; exit 1
